name: Cache nightly PHP
run-name: Cache nightly PHP ${{ inputs.php-version || 'configured version' }}

on:
  schedule:
    - cron: '20 4 * * *'
  workflow_dispatch:
    inputs:
      php-version:
        description: PHP minor version
        required: false
        type: string
      builds:
        description: Space-separated build types
        default: debug release
        required: false
        type: string
      ts:
        description: Space-separated thread-safety modes
        default: nts zts
        required: false
        type: string
      architectures:
        description: Space-separated CPU architectures; leave empty to use the freshness gate
        default: ''
        required: false
        type: string
      homebrew-php-commit:
        description: Optional pinned PHP tap commit for reproducible runs
        type: string
      homebrew-extensions-commit:
        description: Optional pinned extension tap commit for reproducible runs
        type: string
      source-cache-release:
        description: Source bottle release (use an isolated test release for benchmarks)
        default: cache
        type: string
      reuse-archives:
        description: Reuse verified archive checkpoints with matching inputs
        default: true
        type: boolean
      force-source:
        description: Build PHP from source even when an upstream bottle exists
        default: false
        type: boolean
      publish:
        description: Publish validated caches to the PHP release
        default: true
        required: false
        type: boolean
      force:
        description: Rebuild even when the php-src commit is unchanged
        default: false
        required: false
        type: boolean

concurrency:
  group: cache-nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  freshness:
    name: Check nightly php-src commit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      architectures: ${{ steps.freshness.outputs.architectures }}
      build: ${{ steps.freshness.outputs.build }}
      homebrew-extensions-commit: ${{ steps.freshness.outputs.homebrew-extensions-commit }}
      homebrew-php-commit: ${{ steps.freshness.outputs.homebrew-php-commit }}
      php-src-commit: ${{ steps.freshness.outputs.php-src-commit }}
      php-version: ${{ steps.freshness.outputs.php-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out homebrew-php once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/homebrew-php
          ref: ${{ inputs.homebrew-php-commit || '' }}
          path: homebrew-php
          persist-credentials: false

      - name: Check out homebrew-extensions once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/homebrew-extensions
          ref: ${{ inputs.homebrew-extensions-commit || '' }}
          path: homebrew-extensions
          persist-credentials: false

      - name: Compare nightly sources with the published manifest
        id: freshness
        env:
          FORCE: ${{ inputs.force || false }}
          HOMEBREW_EXTENSIONS_PATH: ${{ github.workspace }}/homebrew-extensions
          HOMEBREW_PHP_PATH: ${{ github.workspace }}/homebrew-php
          PHP_VERSION: ${{ inputs.php-version }}
        run: bash scripts/update-nightly.sh

  cache:
    needs: freshness
    if: ${{ needs.freshness.outputs.build == 'true' }}
    permissions:
      # Required by the called publish job to replace GitHub Release assets.
      contents: write
      actions: write
    uses: ./.github/workflows/build.yml
    secrets:
      CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
      CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
      CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
    with:
      channel: nightly
      php-version: ${{ needs.freshness.outputs.php-version }}
      builds: ${{ inputs.builds || 'debug release' }}
      ts: ${{ inputs.ts || 'nts zts' }}
      architectures: ${{ inputs.architectures || needs.freshness.outputs.architectures }}
      homebrew-php-commit: ${{ inputs.homebrew-php-commit || (inputs.architectures == '' || inputs.architectures == needs.freshness.outputs.architectures) && needs.freshness.outputs.homebrew-php-commit || '' }}
      homebrew-extensions-commit: ${{ inputs.homebrew-extensions-commit || (inputs.architectures == '' || inputs.architectures == needs.freshness.outputs.architectures) && needs.freshness.outputs.homebrew-extensions-commit || '' }}
      publish: ${{ github.event_name == 'schedule' || inputs.publish }}
      source-cache-release: ${{ inputs.source-cache-release || 'cache' }}
      reuse-archives: ${{ github.event_name == 'schedule' || inputs.reuse-archives }}
      force-source: ${{ inputs.force-source || false }}
      force: ${{ inputs.force || false }}
