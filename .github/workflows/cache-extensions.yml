name: Cache optional PHP extensions
run-name: Cache optional PHP extensions ${{ inputs.php-versions || '8.4' }}

on:
  workflow_dispatch:
    inputs:
      php-versions:
        description: Space-separated PHP versions (at most 10 per batch)
        default: '8.2 8.3 8.4 8.5'
        type: string
      extensions:
        description: Space-separated optional extension packs
        default: imagick mongodb memcached
        type: string
      builds:
        description: Space-separated build types
        default: debug release
        type: string
      ts:
        description: Space-separated thread-safety modes
        default: nts zts
        type: string
      force:
        description: Rebuild even when package inputs are unchanged
        default: false
        type: boolean
      publish:
        description: Publish verified optional archives
        default: true
        type: boolean
  push:
    paths:
      - .github/workflows/cache-extensions.yml
      - .github/actions/source-cache/**
      - scripts/cache/source-bottle-*
      - scripts/build/extension-pack.cjs
      - scripts/build/build-extensions.sh
      - scripts/build/extension-formula.rb
      - scripts/build/prepare-extension-pack.sh
      - scripts/installer/install-extensions.cjs
      - scripts/tests/native/extension-pack.test.cjs
      - scripts/tests/native/extension-pack-compatibility.test.cjs
      - conf/extension-packs.json

permissions:
  contents: read

concurrency:
  # A focused build must not block seeding other PHP versions. Publication has
  # its own lock so concurrent batches still merge manifests in order.
  group: extension-cache-${{ github.ref }}-${{ inputs.php-versions || '8.4' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      tests: ${{ steps.plan.outputs.tests }}
      extensions-commit: ${{ steps.sources.outputs.extensions }}
      core-commit: ${{ steps.sources.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/homebrew-extensions
          path: homebrew-extensions
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Homebrew/homebrew-core
          path: homebrew-core
          persist-credentials: false
      - name: Record formula snapshots
        id: sources
        run: |
          echo "extensions=$(git -C homebrew-extensions rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "core=$(git -C homebrew-core rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select new or changed extension archives
        id: plan
        env:
          PHP_VERSIONS: ${{ inputs.php-versions }}
          EXTENSION_PACKS: ${{ inputs.extensions }}
          BUILDS: ${{ inputs.builds }}
          THREAD_SAFETY: ${{ inputs.ts }}
          FORCE: ${{ inputs.force || github.event_name == 'push' }}
        run: node scripts/release/extension-packs.cjs plan

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: ${{ matrix.name }} / PHP ${{ matrix.php_version }} / ${{ matrix.build }}-${{ matrix.thread_safety }} / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      PHP_VERSION: ${{ matrix.php_version }}
      BUILD: ${{ matrix.build }}
      TS: ${{ matrix.thread_safety }}
      ARCH: ${{ matrix.architecture }}
      EXTENSION_PACK: ${{ matrix.name }}
      EXTENSION_PACK_OUTPUT: builds/extensions
      HOMEBREW_EXTENSIONS_COMMIT: ${{ needs.plan.outputs.extensions-commit }}
      HOMEBREW_CORE_COMMIT: ${{ needs.plan.outputs.core-commit }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      HOMEBREW_VERBOSE: '1'
      HOMEBREW_VERBOSE_USING_DOTS: '0'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-runtime
      - name: Record dependency cache misses
        run: |
          echo "PHP_DARWIN_BOTTLE_MISSES=$RUNNER_TEMP/bottle-misses.jsonl" >> "$GITHUB_ENV"
          echo "PHP_DARWIN_SOURCE_BOTTLE_MISSES=$RUNNER_TEMP/source-bottle-misses.jsonl" >> "$GITHUB_ENV"
      - name: Clean stale build processes and locks
        run: brew test-bot --only-cleanup-before
      - name: Restore archive tools from the bottle cache
        uses: ./.github/actions/source-cache
        with:
          stage: tools
      - name: Restore the published PHP cache and pin extension sources
        run: bash scripts/build/prepare-extension-pack.sh
      - name: Use the planned Homebrew core recipes
        run: |
          core=$(brew --repository homebrew/core)
          git -C "$core" fetch --depth=1 origin "$HOMEBREW_CORE_COMMIT"
          git -C "$core" checkout --detach "$HOMEBREW_CORE_COMMIT"
      - name: Build optional extensions using cached dependency bottles
        uses: ./.github/actions/source-cache
        with:
          stage: extensions
      - name: Validate the standalone extension archive
        run: '"$PHP_DARWIN_NODE" scripts/tests/native/extension-pack.test.cjs'
      - name: Upload verified optional archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: extension-${{ matrix.name }}-${{ matrix.php_version }}-${{ matrix.build }}-${{ matrix.thread_safety }}-${{ matrix.architecture }}
          path: builds/extensions/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Queue missing upstream bottles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottle-misses-${{ matrix.name }}-${{ matrix.php_version }}-${{ matrix.build }}-${{ matrix.thread_safety }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/bottle-misses.jsonl
          if-no-files-found: ignore
          compression-level: 0
      - name: Queue source-built bottles
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-bottle-misses-${{ matrix.name }}-${{ matrix.php_version }}-${{ matrix.build }}-${{ matrix.thread_safety }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/source-bottle-misses.jsonl
          if-no-files-found: ignore
          compression-level: 0

  compatibility:
    needs: [plan, build]
    name: Test PHP ${{ matrix.php_version }} ${{ matrix.build }}-${{ matrix.thread_safety }} on ${{ matrix.runner }}
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
    env:
      PHP_VERSION: ${{ matrix.php_version }}
      BUILD: ${{ matrix.build }}
      TS: ${{ matrix.thread_safety }}
      ARCH: ${{ matrix.architecture }}
      EXTENSION_PACKS: ${{ toJSON(matrix.packs) }}
      HOMEBREW_EXTENSIONS_COMMIT: ${{ needs.plan.outputs.extensions-commit }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-runtime
      - name: Restore archive tools
        run: |
          "$PHP_DARWIN_NODE" scripts/cache/upstream-bottle-cache.cjs tools
          brew install --verbose jq zstd
      - name: Restore published PHP
        run: bash scripts/build/prepare-extension-pack.sh
      - uses: ./.github/actions/download-artifacts
        with:
          pattern: extension-*-${{ matrix.php_version }}-${{ matrix.build }}-${{ matrix.thread_safety }}-${{ matrix.architecture }}
          path: builds/extensions
      - name: Test optional archives without building extensions
        run: '"$PHP_DARWIN_NODE" scripts/tests/native/extension-pack-compatibility.test.cjs'
      - name: Upload compatibility reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-${{ matrix.php_version }}-${{ matrix.build }}-${{ matrix.thread_safety }}-${{ matrix.runner }}
          path: builds/extensions/*/validation.txt

  cache-bottles:
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.outputs.count != '0'
    uses: ./.github/workflows/cache-bottles.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
      CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
      CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}

  publish:
    needs: [plan, build, compatibility]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.compatibility.result == 'success' || needs.compatibility.result == 'skipped') &&
      github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    concurrency:
      group: extension-cache-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-artifacts
        if: needs.plan.outputs.count != '0'
        with:
          pattern: extension-*
          path: builds/extensions
      - name: Publish archives, then commit the version manifests
        env:
          EXTENSION_PUBLISH_REPORT: ${{ runner.temp }}/extension-publication.json
          GH_TOKEN: ${{ github.token }}
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
        run: |
          mkdir -p builds/extensions
          node --test scripts/tests/unit/extension-packs.test.cjs
          node scripts/release/extension-packs.cjs publish builds/extensions
      - name: Preserve publication diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extension-publication.json
          if-no-files-found: ignore
      - name: Explain publication recovery
        if: failure()
        env:
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          {
            echo 'Builds and compatibility tests already passed. Rerun only failed jobs to resume publication.'
            echo 'To use a newer publisher without rebuilding, run:'
            echo "\`gh workflow run publish-extensions.yml -R shivammathur/php-darwin -f run-id=$SOURCE_RUN\`"
          } >> "$GITHUB_STEP_SUMMARY"
