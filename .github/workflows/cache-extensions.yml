name: Cache optional PHP extensions
run-name: Cache optional PHP extensions ${{ inputs.php-versions || '8.4' }}

on:
  workflow_dispatch:
    inputs:
      php-versions:
        description: PHP minor version (one version per cache run)
        default: '8.4'
        type: choice
        options:
          - '5.6'
          - '7.0'
          - '7.1'
          - '7.2'
          - '7.3'
          - '7.4'
          - '8.0'
          - '8.1'
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
          - '8.6'
          - '8.7'
      extensions:
        description: Space-separated optional extension packs
        default: imagick mongodb memcached
        type: string
      builds:
        description: Space-separated build types
        default: debug release
        type: string
      ts:
        description: Space-separated thread-safety modes
        default: nts zts
        type: string
      force:
        description: Rebuild even when package inputs are unchanged
        default: false
        type: boolean
      publish:
        description: Publish verified optional archives
        default: true
        type: boolean
      resume-runs:
        description: Completed source run IDs, oldest to newest; reuse successful packs and build only unpublished gaps
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  # Each PHP version builds independently. Publication has its own lock so
  # concurrent versions still merge release assets in order.
  group: extension-cache-${{ github.ref }}-${{ inputs.php-versions || '8.4' }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      tests: ${{ steps.plan.outputs.tests }}
      reuse: ${{ steps.plan.outputs.reuse }}
      reuse-count: ${{ steps.plan.outputs.reuse-count }}
      selected-count: ${{ steps.plan.outputs.selected-count }}
      keys: ${{ steps.plan.outputs.keys }}
      extensions-commit: ${{ steps.sources.outputs.extensions }}
      core-commit: ${{ steps.sources.outputs.core }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the approved dependency snapshot
        id: dependencies
        run: echo "core=$(node scripts/cache/approved-dependencies.cjs core)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/homebrew-extensions
          path: homebrew-extensions
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Homebrew/homebrew-core
          ref: ${{ steps.dependencies.outputs.core }}
          path: homebrew-core
          persist-credentials: false
      - name: Record formula snapshots
        id: sources
        run: |
          echo "extensions=$(git -C homebrew-extensions rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "core=$(git -C homebrew-core rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Select new or changed extension archives
        id: plan
        env:
          PHP_VERSIONS: ${{ inputs.php-versions }}
          EXTENSION_PACKS: ${{ inputs.extensions }}
          BUILDS: ${{ inputs.builds }}
          THREAD_SAFETY: ${{ inputs.ts }}
          FORCE: ${{ inputs.force }}
          RESUME_RUNS: ${{ inputs.resume-runs }}
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
        run: node scripts/release/extension-packs.cjs plan

  reuse:
    needs: plan
    if: needs.plan.outputs.reuse-count != '0'
    name: Reuse PHP ${{ matrix.php_version }} / ${{ matrix.architecture }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.reuse) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recover exact verified archives without Homebrew or compilation
        env:
          EXTENSION_ENTRIES: ${{ toJSON(matrix.entries) }}
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
        run: node scripts/release/extension-batches.cjs reuse
      - uses: ./.github/actions/upload-artifacts
        with:
          overwrite: true
          name: extension-reused-${{ matrix.php_version }}-${{ matrix.architecture }}
          path: builds/extensions/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - uses: ./.github/actions/upload-artifacts
        with:
          overwrite: true
          name: extension-index-reused-${{ matrix.php_version }}-${{ matrix.architecture }}
          path: builds/index/entries.json
          if-no-files-found: error

  build:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: Cache PHP ${{ matrix.php_version }} / ${{ matrix.architecture }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      EXTENSION_ENTRIES: ${{ toJSON(matrix.entries) }}
      HOMEBREW_EXTENSIONS_COMMIT: ${{ needs.plan.outputs.extensions-commit }}
      HOMEBREW_CORE_COMMIT: ${{ needs.plan.outputs.core-commit }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_FROM_API: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
      HOMEBREW_VERBOSE: '1'
      HOMEBREW_VERBOSE_USING_DOTS: '0'
      GH_TOKEN: ${{ secrets.TOKEN || github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recover abandoned Homebrew installers
        uses: ./.github/actions/runner-preflight
      - uses: ./.github/actions/node-runtime
      - name: Record dependency cache misses
        run: |
          echo "PHP_DARWIN_BOTTLE_MISSES=$RUNNER_TEMP/bottle-misses.jsonl" >> "$GITHUB_ENV"
          echo "PHP_DARWIN_SOURCE_BOTTLE_MISSES=$RUNNER_TEMP/source-bottle-misses.jsonl" >> "$GITHUB_ENV"
      - name: Clean the disposable build runner
        # test-bot assumes a disposable machine and leaves purged kegs in /tmp.
        if: ${{ runner.environment != 'self-hosted' }}
        run: brew test-bot --only-cleanup-before
      - name: Pin approved dependencies before restoring tools
        run: |
          bash scripts/build/pin-core.sh
          echo "PHP_DARWIN_CORE_PREPARED=$HOMEBREW_CORE_COMMIT" >> "$GITHUB_ENV"
      - name: Check the cleaned Homebrew environment
        run: bash scripts/build/check-homebrew.sh
      - name: Restore archive tools from the bottle cache
        uses: ./.github/actions/source-cache
        with:
          stage: tools
      - name: Cache and validate the missing packs, sharing preparation per PHP runtime
        run: '"$PHP_DARWIN_NODE" scripts/build/extension-batch.cjs build'
      - name: Preserve completed packs even when another pack fails
        if: always()
        uses: ./.github/actions/upload-artifacts
        with:
          overwrite: true
          name: extension-built-${{ matrix.php_version }}-${{ matrix.architecture }}
          path: builds/extensions/
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
      - name: Record independently successful packs for recovery
        if: always()
        uses: ./.github/actions/upload-artifacts
        with:
          overwrite: true
          name: extension-index-built-${{ matrix.php_version }}-${{ matrix.architecture }}
          path: builds/index/entries.json
          if-no-files-found: ignore
      - name: Queue missing upstream bottles
        if: always()
        uses: ./.github/actions/upload-artifacts
        with:
          overwrite: true
          name: bottle-misses-${{ matrix.php_version }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/bottle-misses.jsonl
          if-no-files-found: ignore
          compression-level: 0
      - name: Queue source-built bottles
        if: always()
        uses: ./.github/actions/upload-artifacts
        with:
          overwrite: true
          name: source-bottle-misses-${{ matrix.php_version }}-${{ matrix.architecture }}
          path: ${{ runner.temp }}/source-bottle-misses.jsonl
          if-no-files-found: ignore
          compression-level: 0

  compatibility:
    needs: [plan, build, reuse]
    name: Test PHP ${{ matrix.php_version }} on ${{ matrix.runner }}
    if: >-
      always() && !cancelled() && needs.plan.outputs.selected-count != '0' &&
      needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.reuse.result == 'success' || needs.reuse.result == 'skipped')
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.tests) }}
    env:
      EXTENSION_ENTRIES: ${{ toJSON(matrix.entries) }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recover abandoned Homebrew installers
        uses: ./.github/actions/runner-preflight
      - uses: ./.github/actions/node-runtime
      - name: Restore archive tools
        run: |
          "$PHP_DARWIN_NODE" scripts/cache/upstream-bottle-cache.cjs tools
          brew install --verbose jq zstd
      - uses: ./.github/actions/download-artifacts
        with:
          pattern: extension-@(built|reused)-${{ matrix.php_version }}-${{ matrix.architecture }}
          path: builds/extensions
          merge-multiple: 'true'
      - name: Test every selected variant and pack in this PHP version
        run: '"$PHP_DARWIN_NODE" scripts/build/extension-batch.cjs test'
      - name: Upload compatibility reports
        if: always()
        uses: ./.github/actions/upload-artifacts
        with:
          overwrite: true
          name: compatibility-${{ matrix.php_version }}-${{ matrix.runner }}
          path: builds/extensions/*/validation.txt
          if-no-files-found: ignore

  cache-bottles:
    needs: [plan, build]
    if: always() && !cancelled() && needs.plan.outputs.count != '0'
    uses: ./.github/workflows/cache-bottles.yml
    permissions:
      contents: read
      actions: read
    secrets:
      TOKEN: ${{ secrets.TOKEN }}
      CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
      CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
      CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}

  publish:
    needs: [plan, build, reuse, compatibility]
    if: >-
      always() && !cancelled() && needs.plan.result == 'success' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') &&
      (needs.reuse.result == 'success' || needs.reuse.result == 'skipped') &&
      (needs.compatibility.result == 'success' || needs.compatibility.result == 'skipped') &&
      github.ref == 'refs/heads/main' && inputs.publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    concurrency:
      group: extension-cache-publish
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-artifacts
        if: needs.plan.outputs.selected-count != '0'
        with:
          pattern: extension-@(built|reused)-*
          path: builds/extensions
          merge-multiple: 'true'
      - name: Check the exact tested publication set
        if: needs.plan.outputs.selected-count != '0'
        env:
          EXTENSION_RECOVERY_KEYS: ${{ needs.plan.outputs.keys }}
        run: node scripts/release/extension-recovery.cjs verify builds/extensions
      - name: Publish archives, then commit the version manifests
        env:
          EXTENSION_PUBLISH_REPORT: ${{ runner.temp }}/extension-publication.json
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
        run: |
          mkdir -p builds/extensions
          node scripts/release/extension-packs.cjs publish builds/extensions
      - name: Preserve publication diagnostics
        if: always()
        continue-on-error: true
        uses: ./.github/actions/upload-artifacts
        with:
          overwrite: true
          name: publication-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extension-publication.json
          if-no-files-found: ignore
      - name: Explain publication recovery
        if: failure()
        env:
          SOURCE_RUN: ${{ github.run_id }}
        run: |
          {
            echo 'Builds and compatibility tests already passed. Rerun only failed jobs to resume publication.'
            echo 'To use a newer publisher without rebuilding, run:'
            echo "\`gh workflow run publish-extensions.yml -R shivammathur/php-darwin -f run-id=$SOURCE_RUN\`"
          } >> "$GITHUB_STEP_SUMMARY"
