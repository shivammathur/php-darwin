name: Stage private PHP
run-name: Stage private PHP ${{ inputs.php-version }}

on:
  workflow_dispatch:
    inputs:
      php-version:
        description: Stable PHP minor version
        required: true
        type: string
      source-file:
        description: Filename under uploads/ (optional when exactly one archive matches)
        required: false
        type: string
      source-sha256:
        description: Expected source SHA-256 (optional; otherwise recorded from authenticated R2)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: private-php-${{ inputs.php-version }}
  cancel-in-progress: false

env:
  PRIVATE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  PHP_VERSION: ${{ inputs.php-version }}
  CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
  CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
  CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
  GH_TOKEN: ${{ secrets.TOKEN || github.token }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      architectures: ${{ steps.plan.outputs.architectures }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        name: Pin private source and build inputs
        run: node scripts/private/run.cjs plan node scripts/private/release.cjs plan

  architecture:
    name: ${{ matrix.arch }}
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.architectures) }}
    uses: ./.github/workflows/build-private-architecture.yml
    with:
      php-version: ${{ inputs.php-version }}
      build-id: ${{ github.run_id }}-${{ github.run_attempt }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      test-runners: ${{ toJSON(matrix.test_runners) }}
    secrets:
      PRIVATE_R2_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
      PRIVATE_R2_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
      CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
      TOKEN: ${{ secrets.TOKEN }}

  approve:
    name: Seal tested private build
    needs: [plan, architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Sign complete build and compatibility evidence
        env:
          PRIVATE_RELEASE_SIGNING_KEY: ${{ secrets.PRIVATE_RELEASE_SIGNING_KEY }}
        run: node scripts/private/run.cjs approve node scripts/private/release.cjs approve
      - name: Report private build identifier
        run: echo "Private build ready at builds/$PRIVATE_BUILD_ID/" >> "$GITHUB_STEP_SUMMARY"
