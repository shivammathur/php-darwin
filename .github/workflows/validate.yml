name: Validate cache tooling

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-runtime
      - name: Use the Actions Node runtime
        run: dirname "$PHP_DARWIN_NODE" >> "$GITHUB_PATH"
      - name: Validate syntax, configuration and regression fixtures
        run: bash scripts/tests/run.sh all
