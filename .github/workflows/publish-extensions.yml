name: Publish validated extension caches
run-name: Publish extension caches from run ${{ inputs.run-id }}
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Completed extension run with successful builds and compatibility tests
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: extension-cache-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source builds and compatibility tests
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run-id }}
        run: node scripts/release/extension-packs.cjs validate-publish-run "$SOURCE_RUN"
      - uses: ./.github/actions/download-artifacts
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run-id }}
          pattern: extension-*
          path: builds/extensions
      - name: Publish the existing verified archives
        env:
          GH_TOKEN: ${{ github.token }}
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
        run: node scripts/release/extension-packs.cjs publish builds/extensions
