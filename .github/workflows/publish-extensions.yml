name: Publish validated extension caches
run-name: Publish extension caches (source ${{ inputs.run-id || 'installer only' }})
on:
  workflow_dispatch:
    inputs:
      run-id:
        description: Completed extension run with successful builds and compatibility tests
        required: false
        type: string
      installer-only:
        description: Refresh only the extension installer, without rebuilding or changing archives/manifests
        default: false
        type: boolean
permissions:
  contents: write
  actions: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: extension-cache-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate source builds and compatibility tests
        env:
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
          SOURCE_RUN: ${{ inputs.run-id }}
          INSTALLER_ONLY: ${{ inputs.installer-only }}
        run: |
          if [ "$INSTALLER_ONLY" = true ]; then
            [ -z "$SOURCE_RUN" ] || { echo 'Choose an installer refresh or a source run, not both'; exit 1; }
            mkdir -p builds/extensions
          else
            node scripts/release/extension-packs.cjs validate-publish-run "$SOURCE_RUN"
          fi
      - uses: ./.github/actions/download-artifacts
        if: ${{ !inputs.installer-only }}
        with:
          github-token: ${{ secrets.TOKEN || github.token }}
          run-id: ${{ inputs.run-id }}
          pattern: extension-@(imagick-*|mongodb-*|memcached-*|built-*|reused-*)
          path: builds/extensions
      - name: Publish the existing verified archives
        env:
          EXTENSION_PUBLISH_REPORT: ${{ runner.temp }}/extension-publication.json
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
        run: node scripts/release/extension-packs.cjs publish builds/extensions
      - name: Preserve publication diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: publication-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/extension-publication.json
          if-no-files-found: ignore
      - name: Explain publication recovery
        if: failure()
        run: echo 'Rerun the failed publish job to resume. Matching published objects are verified and reused; no PHP or extension builds are started.' >> "$GITHUB_STEP_SUMMARY"
