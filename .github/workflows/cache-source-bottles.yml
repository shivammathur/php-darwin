name: Cache source-built Homebrew bottles
run-name: Mirror source bottles (${{ inputs.seed && 'all cached builds' || 'build misses' }})

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Mirror every existing source bottle from the cache release
        type: boolean
        default: true
      source-run-id:
        description: Run containing source-bottle-misses artifacts
        type: string
        default: ''
      formula:
        description: Optional dependency name to mirror on its own
        type: string
        default: ''
  workflow_call:
    inputs:
      seed:
        type: boolean
        default: false
      source-run-id:
        type: string
        default: ''
      formula:
        type: string
        default: ''
    secrets:
      CF_R2_AWS_ACCESS_KEY_ID:
        required: false
      CF_R2_AWS_SECRET_ACCESS_KEY:
        required: false
      CF_R2_AWS_S3_ENDPOINT:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    name: Resolve source bottles into one job per dependency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ !inputs.seed }}
        with:
          pattern: source-bottle-misses-*
          path: source-bottle-records
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source-run-id || github.run_id }}
          digest-mismatch: error
      - name: Build the source dependency matrix
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          SEED: ${{ inputs.seed }}
          FORMULA: ${{ inputs.formula }}
        run: |
          mkdir -p source-bottle-records
          node scripts/source-bottle-mirror.cjs matrix source-bottle-records
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-bottle-matrix
          path: source-bottle-matrix.json
          retention-days: 7

  cache:
    name: Cache source bottles for ${{ matrix.formula }}
    needs: matrix
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Copy exact source bundles and verify public Cloudflare bytes
        env:
          BOTTLES: ${{ toJSON(matrix.bottles) }}
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
        run: node scripts/source-bottle-mirror.cjs publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-bottle-verified-${{ matrix.formula }}
          path: source-bottle-verification.json
          if-no-files-found: error
          retention-days: 7
