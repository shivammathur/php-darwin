name: Replace Brotli in published PHP packages
run-name: Repackage PHP with Brotli 1.2.1 on Ubuntu
on:
  workflow_call:
    inputs:
      preparation-run:
        description: Successful Brotli preparation run
        type: string
        required: true
      packages-run:
        description: Reuse archives and successful native checks, retrying the remaining checks
        type: string
        default: ''
      php-versions:
        description: Space-separated versions, or all
        type: string
        default: all
      publish:
        description: Publish only after every archive passes native validation
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      versions: ${{ steps.plan.outputs.versions }}
      test-matrix: ${{ steps.plan.outputs.test-matrix }}
      test-count: ${{ steps.plan.outputs.test-count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          PREPARATION_RUN: ${{ inputs.preparation-run }}
          PACKAGES_RUN: ${{ inputs.packages-run }}
          PHP_VERSIONS: ${{ inputs.php-versions }}
        run: |
          node - <<'JS'
          const fs = require('node:fs'), {execFileSync} = require('node:child_process');
          if (!/^[1-9][0-9]*$/.test(process.env.PREPARATION_RUN)) throw new Error('Invalid source run');
          const run = JSON.parse(execFileSync('gh', ['api', `repos/shivammathur/php-darwin/actions/runs/${process.env.PREPARATION_RUN}`]));
          if (run.path !== '.github/workflows/prepare-brotli.yml' || run.conclusion !== 'success' || run.head_repository.full_name !== 'shivammathur/php-darwin') throw new Error('Unverified Brotli preparation run');
          const configured = fs.readFileSync('conf/versions', 'utf8').trim().split('\n').filter(s => s && !s.startsWith('#')).map(s => s.trim().split(/\s+/)[1]);
          const versions = process.env.PHP_VERSIONS === 'all' ? configured : process.env.PHP_VERSIONS.trim().split(/\s+/);
          if (!versions.length || new Set(versions).size !== versions.length || versions.some(v => !configured.includes(v))) throw new Error('Invalid PHP versions');
          const matrix = {include: versions.flatMap(version => Object.entries(require('./conf/platforms.json')).map(([arch, p]) => ({version, arch, runner:p.build_runner})))};
          let tests = matrix.include;
          if (process.env.PACKAGES_RUN) {
            if (!/^[1-9][0-9]*$/.test(process.env.PACKAGES_RUN)) throw new Error('Invalid packages run');
            const source = JSON.parse(execFileSync('gh', ['api', `repos/shivammathur/php-darwin/actions/runs/${process.env.PACKAGES_RUN}`]));
            if (source.path !== '.github/workflows/mirror.yml' || source.status !== 'completed' || !['success', 'failure'].includes(source.conclusion) || source.head_repository.full_name !== 'shivammathur/php-darwin') throw new Error('Unverified package run');
            const jobPages = JSON.parse(execFileSync('gh', ['api', '--paginate', '--slurp', `repos/shivammathur/php-darwin/actions/runs/${process.env.PACKAGES_RUN}/jobs?per_page=100`]));
            const jobs = jobPages.flatMap(p => p.jobs);
            for (const {version, arch, runner} of matrix.include) {
              const selected = jobs.filter(j => j.name === `brotli / repackage (${version}, ${arch}, ${runner})`);
              if (selected.length !== 1 || selected[0].conclusion !== 'success') throw new Error(`Unverified repackaging: ${version}/${arch}`);
            }
            tests = tests.filter(({version, arch, runner}) => {
              const selected = jobs.filter(j => j.name === `brotli / test (${version}, ${arch}, ${runner})`);
              return selected.length !== 1 || selected[0].conclusion !== 'success';
            });
            const pages = JSON.parse(execFileSync('gh', ['api', '--paginate', '--slurp', `repos/shivammathur/php-darwin/actions/runs/${process.env.PACKAGES_RUN}/artifacts?per_page=100`]));
            const artifacts = pages.flatMap(p => p.artifacts).filter(a => !a.expired);
            for (const {version, arch} of matrix.include) if (artifacts.filter(a => a.name === `brotli-packages-${version}-${arch}`).length !== 1) throw new Error(`Missing verified packages: ${version}/${arch}`);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\nversions=${JSON.stringify(versions)}\ntest-matrix=${JSON.stringify({include:tests})}\ntest-count=${tests.length}\n`);
          console.log(`Reusing ${matrix.include.length - tests.length} successful native checks; testing ${tests.length} version/architecture pairs`);
          JS
  validate:
    uses: ./.github/workflows/validate.yml
  repackage:
    needs: plan
    if: inputs.packages-run == ''
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.arch }}
      PHP_VERSION: ${{ matrix.version }}
      GH_TOKEN: ${{ secrets.TOKEN || github.token }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-runtime
      - uses: ./.github/actions/download-artifacts
        with:
          name: brotli-1.2.1-${{ matrix.arch }}
          run-id: ${{ inputs.preparation-run }}
          github-token: ${{ secrets.TOKEN || github.token }}
          path: replacement
      - name: Install the Mach-O symbol reader
        run: sudo apt-get update && sudo apt-get install -y llvm zstd
      - name: Replace Brotli and prove the remaining payload is preserved
        run: python3 scripts/release/repackage-brotli.py "$PHP_VERSION" "$ARCH" replacement builds
      - uses: ./.github/actions/upload-artifacts
        with:
          name: brotli-packages-${{ matrix.version }}-${{ matrix.arch }}
          path: builds
          if-no-files-found: error
          compression-level: 0
      - uses: ./.github/actions/upload-artifacts
        if: always()
        with:
          name: brotli-evidence-${{ matrix.version }}-${{ matrix.arch }}
          path: builds/evidence
          if-no-files-found: ignore
  test:
    needs: [plan, repackage]
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.test-count != '0' && (needs.repackage.result == 'success' || (needs.repackage.result == 'skipped' && inputs.packages-run != '')) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.test-matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
      PHP_VERSION: ${{ matrix.version }}
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/runner-preflight
      - uses: ./.github/actions/node-runtime
      - name: Restore native archive tools
        run: bash scripts/build/archive-tools.sh
      - uses: ./.github/actions/download-artifacts
        with:
          name: brotli-packages-${{ matrix.version }}-${{ matrix.arch }}
          run-id: ${{ inputs.packages-run || github.run_id }}
          github-token: ${{ secrets.TOKEN || github.token }}
          path: builds
      - name: Validate all PHP variants, warm installs and the previous installer
        run: bash scripts/tests/native/brotli-repack.test.sh
  publish-php:
    if: ${{ always() && !cancelled() && inputs.publish && needs.plan.result == 'success' && needs.validate.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.plan.outputs.test-count == '0')) && (needs.repackage.result == 'success' || (needs.repackage.result == 'skipped' && inputs.packages-run != '')) }}
    needs: [plan, validate, repackage, test]
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    concurrency:
      group: php-darwin-release-publish-${{ matrix.version }}
      cancel-in-progress: false
    env:
      PHP_VERSION: ${{ matrix.version }}
      GH_TOKEN: ${{ secrets.TOKEN || github.token }}
      PHP_DARWIN_MIRROR_REQUIRED: 'true'
      CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
      CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
      CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-artifacts
        with:
          pattern: brotli-packages-${{ matrix.version }}-*
          run-id: ${{ inputs.packages-run || github.run_id }}
          github-token: ${{ secrets.TOKEN || github.token }}
          path: packages
      - name: Verify source manifests and publish immutable replacements
        run: |
          mkdir current builds
          gh release download "php-$PHP_VERSION" --pattern "php-$PHP_VERSION-manifest.json" --dir current
          for arch in arm64 x86_64; do
            cmp "current/php-$PHP_VERSION-manifest.json" "packages/brotli-packages-$PHP_VERSION-$arch/evidence/php-$PHP_VERSION-manifest.json"
            cp -a "packages/brotli-packages-$PHP_VERSION-$arch/$arch" builds/
          done
          bash scripts/release/publish.sh builds
