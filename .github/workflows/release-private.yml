name: Release PHP from private R2
run-name: Release PHP ${{ inputs.release-version }} from private R2

on:
  workflow_dispatch:
    inputs:
      php-version:
        description: PHP minor version (for example 8.4)
        required: true
        type: string
      build-id:
        description: Private build ID (run-attempt from builds/)
        required: true
        type: string
      release-version:
        description: Exact announced PHP version (for example 8.4.27)
        required: true
        type: string
      source-sha256:
        description: Official SHA-256 for the staged tar.xz or tar.gz source archive
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: php-darwin-release-publish-${{ inputs.php-version }}
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PHP_VERSION: ${{ inputs.php-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify approval and official source, then download tested packages
        env:
          PRIVATE_BUILD_ID: ${{ inputs.build-id }}
          RELEASE_VERSION: ${{ inputs.release-version }}
          SOURCE_SHA256: ${{ inputs.source-sha256 }}
          PRIVATE_RELEASE_SIGNING_KEY: ${{ secrets.PRIVATE_RELEASE_SIGNING_KEY }}
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
        run: node scripts/private/release.cjs release
      - name: Publish verified packages, mirror, installer and manifest
        env:
          PHP_DARWIN_MIRROR_REQUIRED: 'true'
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
        run: bash scripts/release/publish.sh builds

  e2e:
    needs: release
    uses: ./.github/workflows/e2e.yml
    secrets:
      TOKEN: ${{ secrets.TOKEN }}
    with:
      php-version: ${{ inputs.php-version }}
      optional-packs: false
