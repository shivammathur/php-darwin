name: Cache Homebrew dependency bottles
run-name: Cache Homebrew bottles (${{ inputs.seed && 'all configurations' || 'build misses' }})

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Resolve and cache dependencies for every PHP configuration
        type: boolean
        default: true
      source-run-id:
        description: Optional run containing native bottle plans for a seed retry, or bottle misses when seed is false
        type: string
        default: ''
  workflow_call:
    secrets:
      TOKEN:
        required: false
      CF_R2_AWS_ACCESS_KEY_ID:
        required: false
      CF_R2_AWS_SECRET_ACCESS_KEY:
        required: false
      CF_R2_AWS_S3_ENDPOINT:
        required: false
    inputs:
      seed:
        type: boolean
        default: false
      source-run-id:
        type: string
        default: ''

permissions:
  contents: read
  actions: read

jobs:
  source-bottles:
    name: Mirror source-built dependency bottles
    uses: ./.github/workflows/cache-source-bottles.yml
    with:
      seed: ${{ inputs.seed }}
      source-run-id: ${{ inputs.source-run-id || github.run_id }}
    secrets:
      TOKEN: ${{ secrets.TOKEN }}
      CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
      CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
      CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}

  resolve:
    name: Resolve every PHP configuration on ${{ matrix.runner }}
    if: ${{ inputs.seed && inputs.source-run-id == '' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_VERBOSE: '1'
      HOMEBREW_VERBOSE_USING_DOTS: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/runner-preflight
      - uses: ./.github/actions/node-runtime
      - name: Restore missing archive tools without compiling
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/build/archive-tools.sh
      - name: Prepare current formula definitions without installing packages
        uses: ./.github/actions/core-recipes
      - name: Prepare PHP and extension formula definitions
        run: |
          bash scripts/build/cleanup-taps.sh
          for tap in shivammathur/php shivammathur/extensions; do
            brew tap "$tap"
            brew trust "$tap"
            repository=$(brew --repository "$tap")
            git -C "$repository" fetch --depth=1 origin main
            git -C "$repository" checkout --detach --force FETCH_HEAD
          done
      - name: Resolve runtime and source-build dependencies
        run: bash scripts/cache/seed-bottle-plan.sh
      - name: Save the exact dependency plan
        uses: ./.github/actions/upload-artifacts
        with:
          name: bottle-plan-${{ matrix.runner }}
          path: |
            bottles.jsonl
            bottle-plan.json
          if-no-files-found: error
          retention-days: 7
      - name: Restore the runner's original core tap
        if: always()
        run: bash scripts/tests/helpers/core-tap-layout.sh restore

  matrix:
    name: Deduplicate bottles into one job per dependency
    needs: resolve
    if: ${{ always() && !cancelled() && (!inputs.seed || inputs.source-run-id != '' || needs.resolve.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-artifacts
        with:
          pattern: ${{ inputs.seed && 'bottle-plan-*' || 'bottle-misses-*' }}
          path: bottle-records
          github-token: ${{ secrets.TOKEN || github.token }}
          run-id: ${{ inputs.source-run-id || github.run_id }}
      - name: Build the dependency matrix
        id: matrix
        run: |
          mkdir -p bottle-records
          node scripts/cache/upstream-bottle-cache.cjs matrix bottle-records
      - uses: ./.github/actions/upload-artifacts
        with:
          name: bottle-matrix
          path: bottle-matrix.json
          retention-days: 7

  cache:
    name: Cache ${{ matrix.formula }}
    needs: matrix
    if: ${{ !cancelled() && needs.matrix.result == 'success' && needs.matrix.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/download-artifacts
        with:
          name: bottle-matrix
          path: ${{ runner.temp }}/bottle-plan
      - name: Copy and verify exact bottles through the public Cloudflare endpoint
        env:
          FORMULA: ${{ matrix.formula }}
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
        run: node scripts/cache/upstream-bottle-cache.cjs publish "$RUNNER_TEMP/bottle-plan/bottle-matrix.json" "$FORMULA"
      - name: Summarize verified dependency bottles
        run: |
          jq -r '.[] | "- \(.formula) \(.version) / \(.tag): \(.result), SHA-256 `\(.sha256)`"' bottle-verification.json >> "$GITHUB_STEP_SUMMARY"
      - name: Name the verification artifact
        id: artifact
        env:
          FORMULA: ${{ matrix.formula }}
        run: echo "name=bottle-verified-${FORMULA//\//-}" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/upload-artifacts
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: bottle-verification.json
          if-no-files-found: error
          retention-days: 7
