name: Repair drained Intel runner

on:
  push:
    branches: [fix/keg-only-dependency-links]
    paths: [.github/workflows/runner-lock-inspection.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  inspect:
    runs-on: ${{ 'php-darwin-runner-repair' }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.TOKEN || github.token }}
      HOMEBREW_DEVELOPER: '1'
      CACHE_RELEASE: source-bottles-test-${{ github.run_id }}
    steps:
      - name: Stop the verified orphaned Homebrew process
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import os, signal, subprocess, time
          pid = 86016
          expected_start = 'Sun Sep 27 05:57:16 2026'
          def field(name):
              return subprocess.check_output(['ps', '-p', str(pid), '-o', name + '='], text=True).strip()
          def same_process():
              try: return field('lstart') == expected_start
              except subprocess.CalledProcessError: return False
          assert same_process(), 'Process identity changed; refusing cleanup'
          assert field('ppid') == '1', 'Process is not orphaned'
          assert field('comm') == '/usr/local/Homebrew/Library/Homebrew/vendor/portable-ruby/current/bin/ruby'
          assert int(field('uid')) == os.getuid(), 'Process is not owned by the runner user'
          argv = field('args')
          assert 'brew.rb' in argv and 'install' in argv and 'imagick@8.5' in argv, 'Unexpected Homebrew invocation'
          holders = subprocess.check_output(['/usr/sbin/lsof', '-t', '/usr/local/var/homebrew/locks/argon2.formula.lock'], text=True).split()
          assert str(pid) in holders, 'Expected process no longer holds the Argon2 lock'
          print('Confirmed orphaned Imagick installation and Argon2 lock ownership; sending SIGTERM')
          os.kill(pid, signal.SIGTERM)
          for _ in range(30):
              if not same_process(): break
              time.sleep(0.1)
          if same_process():
              print('Verified orphan still running; sending SIGKILL')
              os.kill(pid, signal.SIGKILL)
              time.sleep(1)
          assert not same_process(), 'Orphaned Homebrew process survived cleanup'
          PYTHON
          /usr/bin/ruby -e 'File.open(ARGV.fetch(0), "r+") { |f| abort "Argon2 lock still held" unless f.flock(File::LOCK_EX | File::LOCK_NB); puts "Argon2 lock is available" }' /usr/local/var/homebrew/locks/argon2.formula.lock
          /usr/sbin/lsof -nP +D /usr/local/var/homebrew/locks || true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 19d7cd6d9a5274564bc54576a021984f25d10c14
          persist-credentials: false
      - uses: ./.github/actions/node-runtime
      - name: Prepare isolated native regression test
        id: prepare
        run: |
          gh release create "$CACHE_RELEASE" --target "$GITHUB_SHA" --title "$CACHE_RELEASE" --notes 'Temporary runner repair verification.' --prerelease --latest=false
          bash scripts/tests/native/source-bottle-native.test.sh prepare
      - name: Install private versioned build dependency
        uses: ./.github/actions/source-cache
        with:
          formula: php-darwin/source-cache-test/php-darwin-cache-app
          release: source-bottles-test-${{ github.run_id }}
      - name: Verify linking and clear the fixture packages
        run: |
          bash scripts/tests/native/source-bottle-native.test.sh verify
          bash scripts/tests/native/source-bottle-native.test.sh reset
      - name: Restore the fixture packages from cache
        id: warm
        uses: ./.github/actions/source-cache
        with:
          formula: php-darwin/source-cache-test/php-darwin-cache-app
          release: source-bottles-test-${{ github.run_id }}
      - name: Verify linking and cache reuse
        env:
          BUILT: ${{ steps.warm.outputs.built }}
          RESTORED: ${{ steps.warm.outputs.restored }}
        run: |
          test "$BUILT" = 0
          test "$RESTORED" = 3
          bash scripts/tests/native/source-bottle-native.test.sh verify
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: dependency-link-repair-verification
          path: .source-bottle-cache
          include-hidden-files: true
          retention-days: 2
          compression-level: 0
      - name: Remove native fixtures
        if: ${{ always() && steps.prepare.outcome == 'success' }}
        run: |
          bash scripts/tests/native/source-bottle-native.test.sh cleanup
          gh release delete "$CACHE_RELEASE" --yes --cleanup-tag
