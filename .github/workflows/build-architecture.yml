name: Build and test one PHP cache architecture

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      test-runners:
        required: true
        type: string
      variants:
        required: true
        type: string
      builds:
        required: true
        type: string
      ts:
        required: true
        type: string
      homebrew-php-commit:
        required: true
        type: string
      homebrew-extensions-commit:
        required: true
        type: string
      source-cache-release:
        required: true
        type: string
      reuse-archives:
        default: true
        type: boolean
      force-source:
        default: false
        type: boolean

permissions:
  contents: read

env:
  HOMEBREW_DEVELOPER: '1'
  HOMEBREW_NO_AUTO_UPDATE: '1'
  HOMEBREW_NO_INSTALL_FROM_API: '1'
  HOMEBREW_VERBOSE: '1'
  HOMEBREW_VERBOSE_USING_DOTS: '0'

jobs:
  build:
    name: Build PHP ${{ inputs.php-version }} ${{ matrix.build }}/${{ matrix.ts }} package on ${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.variants) }}
    permissions:
      # Source bottles are persisted as GitHub Release assets.
      contents: write
      actions: write
    env:
      ARCH: ${{ inputs.arch }}
      BUILD: ${{ matrix.build }}
      TS: ${{ matrix.ts }}
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_EXTENSIONS_COMMIT: ${{ inputs.homebrew-extensions-commit }}
      HOMEBREW_PHP_COMMIT: ${{ inputs.homebrew-php-commit }}
      PHP_VERSION: ${{ inputs.php-version }}
      REUSE_ARCHIVES: ${{ inputs.reuse-archives }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize build timing data
        run: |
          {
            echo "PHP_DARWIN_METRICS=$RUNNER_TEMP/php-darwin-metrics.jsonl"
            echo "PHP_DARWIN_BOTTLE_MISSES=$RUNNER_TEMP/bottle-misses.jsonl"
            echo "PHP_DARWIN_SOURCE_BOTTLE_MISSES=$RUNNER_TEMP/source-bottle-misses.jsonl"
          } >> "$GITHUB_ENV"
          : > "$RUNNER_TEMP/php-darwin-metrics.jsonl"
          : > "$RUNNER_TEMP/bottle-misses.jsonl"
          : > "$RUNNER_TEMP/source-bottle-misses.jsonl"

      - name: Preserve Node before Homebrew cleanup
        uses: ./.github/actions/node-runtime

      - name: Bound Homebrew bottle downloads
        run: |
          printf 'http1.1\nmax-time = 600\nretry-max-time = 900\n' > "$RUNNER_TEMP/php-darwin-curlrc"
          echo "HOMEBREW_CURLRC=$RUNNER_TEMP/php-darwin-curlrc" >> "$GITHUB_ENV"

      - name: Clean runner before building PHP
        run: brew test-bot --only-cleanup-before

      - name: Restore Homebrew build tools
        run: |
          "$PHP_DARWIN_NODE" scripts/upstream-bottle-cache.cjs tools
          brew install --verbose jq zstd

      - name: Remove unused Homebrew taps
        run: bash scripts/cleanup-taps.sh

      - name: Prepare ${{ matrix.build }}/${{ matrix.ts }} Homebrew tap
        run: bash scripts/build.sh prepare

      - name: Clean runner for ${{ matrix.build }}/${{ matrix.ts }}
        run: bash scripts/build.sh cleanup

      - name: Install ${{ matrix.build }}/${{ matrix.ts }} PHP formula
        uses: ./.github/actions/source-cache
        with:
          release: ${{ inputs.source-cache-release }}
          force-source: ${{ inputs.force-source }}

      - name: Cache ${{ matrix.build }}/${{ matrix.ts }} coverage extensions
        uses: ./.github/actions/source-cache
        with:
          release: ${{ inputs.source-cache-release }}
          force-source: ${{ inputs.force-source }}
          stage: extensions

      - name: Restore verified ${{ matrix.build }}/${{ matrix.ts }} archive checkpoint
        id: checkpoint
        run: '"$PHP_DARWIN_NODE" scripts/archive-checkpoint.cjs restore'

      - name: Package ${{ matrix.build }}/${{ matrix.ts }} Homebrew cache
        if: ${{ steps.checkpoint.outputs.hit != 'true' }}
        run: bash scripts/build.sh package

      - name: Verify ${{ matrix.build }}/${{ matrix.ts }} archive
        run: bash scripts/build.sh verify

      - name: Stage verified ${{ matrix.build }}/${{ matrix.ts }} checkpoint
        id: stage
        run: '"$PHP_DARWIN_NODE" scripts/archive-checkpoint.cjs stage'

      - name: Upload verified ${{ matrix.build }}/${{ matrix.ts }} checkpoint
        if: ${{ steps.checkpoint.outputs.current != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.checkpoint.outputs.name }}
          path: ${{ steps.stage.outputs.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: Remove superseded ${{ matrix.build }}/${{ matrix.ts }} checkpoints from this run
        run: '"$PHP_DARWIN_NODE" scripts/archive-checkpoint.cjs prune'

      - name: Reset runner after ${{ matrix.build }}/${{ matrix.ts }}
        if: ${{ always() }}
        run: bash scripts/build.sh reset

      - name: Summarize source builds and checkpoints
        if: ${{ always() }}
        run: '"$PHP_DARWIN_NODE" scripts/workflow-report.cjs local'

      - name: Queue missing Cloudflare bottles
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottle-misses-${{ inputs.php-version }}-${{ inputs.arch }}-${{ matrix.build }}-${{ matrix.ts }}
          path: ${{ runner.temp }}/bottle-misses.jsonl
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: Queue source-built bottles for Cloudflare
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-bottle-misses-${{ inputs.php-version }}-${{ inputs.arch }}-${{ matrix.build }}-${{ matrix.ts }}
          path: ${{ runner.temp }}/source-bottle-misses.jsonl
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
          overwrite: true

      - name: Upload build timing data
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: timing-${{ inputs.php-version }}-${{ inputs.arch }}-${{ matrix.build }}-${{ matrix.ts }}
          path: ${{ runner.temp }}/php-darwin-metrics.jsonl
          if-no-files-found: ignore
          compression-level: 0
          retention-days: 7
          overwrite: true

  test:
    name: Test PHP ${{ inputs.php-version }} packages on ${{ matrix.runner }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ inputs.arch }}
      HOMEBREW_EXTENSIONS_COMMIT: ${{ inputs.homebrew-extensions-commit }}
      HOMEBREW_PHP_COMMIT: ${{ inputs.homebrew-php-commit }}
      PHP_VERSION: ${{ inputs.php-version }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.test-runners) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove unused Homebrew taps
        run: bash scripts/cleanup-taps.sh

      - name: Download architecture caches built on the minimum macOS version
        uses: ./.github/actions/download-artifacts
        timeout-minutes: 10
        with:
          pattern: php-${{ inputs.php-version }}-${{ inputs.arch }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/php-darwin

      - name: Prepare release/NTS Homebrew formula source
        id: prepare-release-nts
        if: ${{ contains(inputs.builds, 'release') && contains(inputs.ts, 'nts') }}
        env: &release-nts
          BUILD: release
          TS: nts
        run: bash scripts/test-install.sh prepare

      - name: Install release/NTS Homebrew cache
        if: ${{ contains(inputs.builds, 'release') && contains(inputs.ts, 'nts') }}
        env: *release-nts
        run: bash scripts/test-install.sh install

      - name: Validate release/NTS PHP runtime and build flags
        if: ${{ contains(inputs.builds, 'release') && contains(inputs.ts, 'nts') }}
        env: *release-nts
        run: bash scripts/test-install.sh runtime

      - name: Validate release/NTS Homebrew state and operations
        if: ${{ contains(inputs.builds, 'release') && contains(inputs.ts, 'nts') }}
        env: *release-nts
        run: bash scripts/test-install.sh homebrew

      - name: Reset runner after release/NTS validation
        if: ${{ always() && steps.prepare-release-nts.outcome != 'skipped' && steps.prepare-release-nts.outcome != '' }}
        env: *release-nts
        run: bash scripts/test-install.sh reset

      - name: Prepare release/ZTS Homebrew formula source
        id: prepare-release-zts
        if: ${{ contains(inputs.builds, 'release') && contains(inputs.ts, 'zts') }}
        env: &release-zts
          BUILD: release
          TS: zts
        run: bash scripts/test-install.sh prepare

      - name: Install release/ZTS Homebrew cache
        if: ${{ contains(inputs.builds, 'release') && contains(inputs.ts, 'zts') }}
        env: *release-zts
        run: bash scripts/test-install.sh install

      - name: Validate release/ZTS PHP runtime and build flags
        if: ${{ contains(inputs.builds, 'release') && contains(inputs.ts, 'zts') }}
        env: *release-zts
        run: bash scripts/test-install.sh runtime

      - name: Validate release/ZTS Homebrew state and operations
        if: ${{ contains(inputs.builds, 'release') && contains(inputs.ts, 'zts') }}
        env: *release-zts
        run: bash scripts/test-install.sh homebrew

      - name: Reset runner after release/ZTS validation
        if: ${{ always() && steps.prepare-release-zts.outcome != 'skipped' && steps.prepare-release-zts.outcome != '' }}
        env: *release-zts
        run: bash scripts/test-install.sh reset

      - name: Prepare debug/NTS Homebrew formula source
        id: prepare-debug-nts
        if: ${{ contains(inputs.builds, 'debug') && contains(inputs.ts, 'nts') }}
        env: &debug-nts
          BUILD: debug
          TS: nts
        run: bash scripts/test-install.sh prepare

      - name: Install debug/NTS Homebrew cache
        if: ${{ contains(inputs.builds, 'debug') && contains(inputs.ts, 'nts') }}
        env: *debug-nts
        run: bash scripts/test-install.sh install

      - name: Validate debug/NTS PHP runtime and build flags
        if: ${{ contains(inputs.builds, 'debug') && contains(inputs.ts, 'nts') }}
        env: *debug-nts
        run: bash scripts/test-install.sh runtime

      - name: Validate debug/NTS Homebrew state and operations
        if: ${{ contains(inputs.builds, 'debug') && contains(inputs.ts, 'nts') }}
        env: *debug-nts
        run: bash scripts/test-install.sh homebrew

      - name: Reset runner after debug/NTS validation
        if: ${{ always() && steps.prepare-debug-nts.outcome != 'skipped' && steps.prepare-debug-nts.outcome != '' }}
        env: *debug-nts
        run: bash scripts/test-install.sh reset

      - name: Prepare debug/ZTS Homebrew formula source
        id: prepare-debug-zts
        if: ${{ contains(inputs.builds, 'debug') && contains(inputs.ts, 'zts') }}
        env: &debug-zts
          BUILD: debug
          TS: zts
        run: bash scripts/test-install.sh prepare

      - name: Install debug/ZTS Homebrew cache
        if: ${{ contains(inputs.builds, 'debug') && contains(inputs.ts, 'zts') }}
        env: *debug-zts
        run: bash scripts/test-install.sh install

      - name: Validate debug/ZTS PHP runtime and build flags
        if: ${{ contains(inputs.builds, 'debug') && contains(inputs.ts, 'zts') }}
        env: *debug-zts
        run: bash scripts/test-install.sh runtime

      - name: Validate debug/ZTS Homebrew state and operations
        if: ${{ contains(inputs.builds, 'debug') && contains(inputs.ts, 'zts') }}
        env: *debug-zts
        run: bash scripts/test-install.sh homebrew

      - name: Reset runner after debug/ZTS validation
        if: ${{ always() && steps.prepare-debug-zts.outcome != 'skipped' && steps.prepare-debug-zts.outcome != '' }}
        env: *debug-zts
        run: bash scripts/test-install.sh reset
