name: Publish PHP cache
run-name: Publish PHP ${{ inputs.php-version }} cache from run ${{ inputs.run-id }}

on:
  workflow_dispatch:
    inputs:
      php-version:
        description: PHP minor version
        required: true
        type: string
      run-id:
        description: Space-separated workflow run IDs containing the complete PHP archive set
        required: true
        type: string

concurrency:
  group: php-darwin-release-publish-${{ inputs.php-version }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish PHP ${{ inputs.php-version }} release assets
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download completed cache packages
        env:
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
          PHP_VERSION: ${{ inputs.php-version }}
          RUN_IDS: ${{ inputs.run-id }}
        run: |
          mkdir -p builds
          for run_id in $RUN_IDS; do
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
            gh run download "$run_id" --repo shivammathur/php-darwin \
              --pattern "php-$PHP_VERSION-*" --dir builds
          done

      - name: Restore already-published architectures outside the recovered matrix
        env:
          PHP_VERSION: ${{ inputs.php-version }}
        run: bash scripts/release/restore-missing-architectures.sh builds

      - name: Replace versioned release assets
        env:
          PHP_DARWIN_MIRROR_REQUIRED: 'true'
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
          PHP_VERSION: ${{ inputs.php-version }}
        run: bash scripts/release/publish.sh builds
