name: POC Intel PHP cache
run-name: POC PHP 8.5 Intel/Homebrew cache

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: Existing workflow run whose Intel build artifact should be reused
        required: false
        type: string
  push:
    branches:
      - feature/intel-homebrew

permissions:
  actions: read
  contents: read

env:
  BUILD: release
  HOMEBREW_DEVELOPER: '1'
  PHP_VERSION: '8.5'
  TS: nts

jobs:
  source:
    name: Pin formula sources
    if: ${{ inputs.artifact_run_id == '' && github.event_name != 'push' }}
    runs-on: ubuntu-latest
    outputs:
      extensions: ${{ steps.extensions.outputs.commit }}
      php: ${{ steps.php.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the isolated Intel configuration
        run: bash scripts/intel-poc.sh validate
      - name: Pin homebrew-php
        id: php
        run: bash scripts/source-commit.sh
      - name: Pin homebrew-extensions
        id: extensions
        run: bash scripts/source-commit.sh extensions

  build-intel:
    name: Build and cache PHP 8.5 with Homebrew on Intel
    needs: source
    if: ${{ inputs.artifact_run_id == '' && github.event_name != 'push' }}
    runs-on: macos-15-intel
    timeout-minutes: 240
    env:
      ARCH: x86_64
      HOMEBREW_EXTENSIONS_COMMIT: ${{ needs.source.outputs.extensions }}
      HOMEBREW_PHP_COMMIT: ${{ needs.source.outputs.php }}
      PHP_DARWIN_BACKEND: intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove unused Homebrew taps
        run: bash scripts/cleanup-taps.sh
      - name: Prepare the pinned homebrew-php tap
        run: bash scripts/build.sh prepare
      - name: Clean the runner while preserving PHP dependencies
        run: bash scripts/build.sh cleanup
      - name: Install PHP with Homebrew
        run: bash scripts/build.sh install
      - name: Install xdebug and pcov with Homebrew
        run: bash scripts/build-extensions.sh
      - name: Package the complete Homebrew runtime closure
        run: bash scripts/build.sh package
      - name: Verify the archive and metadata
        run: bash scripts/build.sh verify
      - name: Reset the build runner
        if: ${{ always() }}
        run: bash scripts/build.sh reset
      - name: Upload the Intel cache POC
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-8.5-intel-homebrew-poc
          path: builds
          if-no-files-found: error
          retention-days: 2
          overwrite: true

  profile-arm:
    name: Profile the ARM Homebrew cache
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the published ARM cache
        run: |
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/install.sh" \
            https://github.com/shivammathur/php-darwin/releases/download/php-8.5/install.sh
          bash "$RUNNER_TEMP/install.sh" 8.5 release nts
      - name: Capture the ARM PHP and PECL profile
        env:
          PROFILE_NAME: homebrew-arm64
        run: bash scripts/intel-poc.sh profile "$RUNNER_TEMP/profile-arm"
      - name: Upload the ARM profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-homebrew-arm64
          path: ${{ runner.temp }}/profile-arm
          if-no-files-found: error
          retention-days: 2

  install-intel:
    name: Install and validate the Intel Homebrew cache
    needs: build-intel
    if: ${{ always() && (needs.build-intel.result == 'success' || inputs.artifact_run_id != '' || github.event_name == 'push') }}
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      ARCH: x86_64
      PHP_DARWIN_BACKEND: intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove unused Homebrew taps
        run: bash scripts/cleanup-taps.sh
      - name: Download the Intel cache POC
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: php-8.5-intel-homebrew-poc
          path: ${{ runner.temp }}/php-darwin-intel
          run-id: ${{ inputs.artifact_run_id || (github.event_name == 'push' && '34219423931') || github.run_id }}
      - name: Prepare a fresh Homebrew installation state
        env: &intel-test
          ARCHIVE_DIR: ${{ runner.temp }}/php-darwin-intel
        run: bash scripts/test-install.sh prepare
      - name: Install the cache directly into the Homebrew prefix
        env: *intel-test
        run: bash scripts/install-package.sh 8.5 release nts "$ARCHIVE_DIR/php_8.5-nts-release+darwin_x86_64.tar.zst"
      - name: Validate PHP, extensions, PEAR, and PECL
        env: *intel-test
        run: bash scripts/test-install.sh runtime
      - name: Validate Homebrew receipts, links, services, and rollback state
        env: *intel-test
        run: bash scripts/test-install.sh homebrew
      - name: Capture the Intel PHP and PECL profile
        env:
          PROFILE_NAME: homebrew-x86_64
        run: bash scripts/intel-poc.sh profile "$RUNNER_TEMP/profile-intel"
      - name: Upload the Intel profile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: profile-homebrew-x86-64
          path: ${{ runner.temp }}/profile-intel
          if-no-files-found: error
          retention-days: 2

  compare:
    name: Compare ARM and Intel Homebrew functionality
    needs: [profile-arm, install-intel]
    if: ${{ always() && needs.profile-arm.result == 'success' && needs.install-intel.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download PHP capability profiles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: profile-*
          path: ${{ runner.temp }}/profiles
      - name: Compare extensions, PECL configuration, and phpinfo capabilities
        run: |
          bash scripts/intel-poc.sh compare \
            "$RUNNER_TEMP/profiles/profile-homebrew-arm64" \
            "$RUNNER_TEMP/profiles/profile-homebrew-x86-64"

  publish-poc:
    name: Publish the validated Intel POC release
    needs: compare
    if: ${{ always() && needs.compare.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download the validated Intel cache
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: php-8.5-intel-homebrew-poc
          path: builds
          run-id: ${{ inputs.artifact_run_id || (github.event_name == 'push' && '34219423931') || github.run_id }}
      - name: Publish using the GitHub REST API
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/intel-poc.sh publish builds
