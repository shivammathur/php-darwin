name: Build and publish PHP cache

on:
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
      channel:
        required: true
        type: string
      builds:
        default: debug release
        required: false
        type: string
      ts:
        default: nts zts
        required: false
        type: string
      architectures:
        default: arm64 x86_64
        required: false
        type: string
      publish:
        default: true
        required: false
        type: boolean

permissions:
  contents: read

env:
  HOMEBREW_DEVELOPER: '1'

jobs:
  matrix:
    name: Create build and test matrices
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build-matrix }}
      source-commit: ${{ steps.source.outputs.commit }}
      test: ${{ steps.matrix.outputs.test-matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create build and compatibility-test matrices
        id: matrix
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          BUILDS: ${{ inputs.builds }}
          CHANNEL: ${{ inputs.channel }}
          PHP_VERSION: ${{ inputs.php-version }}
          PUBLISH: ${{ inputs.publish }}
          TS: ${{ inputs.ts }}
        run: |
          bash scripts/validate.sh
          bash scripts/get-matrix.sh

      - name: Pin the homebrew-php source commit
        id: source
        run: bash scripts/source-commit.sh

  build:
    name: Build PHP ${{ matrix.php }} ${{ matrix.build }}/${{ matrix.ts }} on ${{ matrix.arch }}
    needs: matrix
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ matrix.arch }}
      BUILD: ${{ matrix.build }}
      HOMEBREW_PHP_COMMIT: ${{ needs.matrix.outputs.source-commit }}
      PHP_VERSION: ${{ matrix.php }}
      TS: ${{ matrix.ts }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.build) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove unused Homebrew taps
        run: bash scripts/cleanup-taps.sh

      - name: Prepare Homebrew tap
        run: bash scripts/build.sh prepare

      - name: Clean runner and snapshot Homebrew
        run: bash scripts/build.sh cleanup

      - name: Install PHP formula
        run: bash scripts/build.sh install

      - name: Package additive Homebrew cache
        run: bash scripts/build.sh package

      - name: Verify compressed archive
        run: bash scripts/build.sh verify

      - name: Upload cache for compatibility tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: php-${{ matrix.php }}-${{ matrix.build }}-${{ matrix.ts }}-${{ matrix.arch }}
          path: builds
          if-no-files-found: error
          retention-days: 2

  test:
    name: Test PHP ${{ matrix.php }} ${{ matrix.build }}/${{ matrix.ts }} ${{ matrix.arch }} on ${{ matrix.runner }}
    needs: [matrix, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      ARCH: ${{ matrix.arch }}
      BUILD: ${{ matrix.build }}
      HOMEBREW_PHP_COMMIT: ${{ needs.matrix.outputs.source-commit }}
      PHP_DARWIN_TIMING_LOG: ${{ github.workspace }}/php-darwin-timing.log
      PHP_VERSION: ${{ matrix.php }}
      TS: ${{ matrix.ts }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.test) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove unused Homebrew taps
        run: bash scripts/cleanup-taps.sh

      - name: Download cache built on the minimum macOS version
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: php-${{ matrix.php }}-${{ matrix.build }}-${{ matrix.ts }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/php-darwin

      - name: Prepare Homebrew formula source
        run: bash scripts/test-install.sh prepare

      - name: Install additive Homebrew cache
        run: bash scripts/test-install.sh install

      - name: Validate PHP runtime and build flags
        run: bash scripts/test-install.sh runtime

      - name: Validate Homebrew state and operations
        run: bash scripts/test-install.sh homebrew

  publish:
    name: Publish PHP ${{ inputs.php-version }} release assets
    if: ${{ inputs.publish }}
    needs: [matrix, build, test]
    runs-on: ubuntu-latest
    concurrency:
      group: php-darwin-release-publish
      cancel-in-progress: false
    permissions:
      # Required to create and replace GitHub Release assets.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated caches
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: php-${{ inputs.php-version }}-*
          path: builds

      - name: Replace versioned release assets
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_PHP_COMMIT: ${{ needs.matrix.outputs.source-commit }}
        run: bash scripts/publish.sh builds
