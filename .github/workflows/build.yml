name: Build and publish PHP cache

on:
  workflow_call:
    secrets:
      CF_R2_AWS_ACCESS_KEY_ID:
        required: false
      CF_R2_AWS_SECRET_ACCESS_KEY:
        required: false
      CF_R2_AWS_S3_ENDPOINT:
        required: false
    inputs:
      php-version:
        required: true
        type: string
      channel:
        required: true
        type: string
      builds:
        default: debug release
        required: false
        type: string
      ts:
        default: nts zts
        required: false
        type: string
      architectures:
        default: arm64 x86_64
        required: false
        type: string
      homebrew-php-commit:
        default: ''
        required: false
        type: string
      homebrew-extensions-commit:
        default: ''
        required: false
        type: string
      source-cache-release:
        default: cache
        type: string
      reuse-archives:
        default: true
        type: boolean
      force-source:
        default: false
        type: boolean
      force:
        default: false
        type: boolean
      publish:
        default: true
        required: false
        type: boolean

permissions:
  contents: read

env:
  HOMEBREW_DEVELOPER: '1'

jobs:
  matrix:
    name: Create build and test matrices
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build: ${{ steps.matrix.outputs.build-matrix }}
      variants: ${{ steps.matrix.outputs.variant-matrix }}
      build-required: ${{ steps.freshness.outputs.build-required }}
      extensions-source-commit: ${{ steps.extensions-source.outputs.commit }}
      source-commit: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create build and compatibility-test matrices
        id: matrix
        env:
          ARCHITECTURES: ${{ inputs.architectures }}
          BUILDS: ${{ inputs.builds }}
          CHANNEL: ${{ inputs.channel }}
          HOMEBREW_EXTENSIONS_COMMIT: ${{ inputs.homebrew-extensions-commit }}
          HOMEBREW_PHP_COMMIT: ${{ inputs.homebrew-php-commit }}
          PHP_VERSION: ${{ inputs.php-version }}
          PUBLISH: ${{ inputs.publish }}
          TS: ${{ inputs.ts }}
        run: |
          bash scripts/tests/run.sh check
          bash scripts/build/get-matrix.sh

      - name: Pin the homebrew-php source commit
        id: source
        env:
          PINNED_COMMIT: ${{ inputs.homebrew-php-commit }}
        run: bash scripts/build/source-commit.sh

      - name: Pin the homebrew-extensions source commit
        id: extensions-source
        env:
          PINNED_COMMIT: ${{ inputs.homebrew-extensions-commit }}
        run: bash scripts/build/source-commit.sh extensions

      - name: Check out the pinned PHP formulae for freshness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/homebrew-php
          ref: ${{ steps.source.outputs.commit }}
          path: homebrew-php
          persist-credentials: false

      - name: Check out the pinned extension formulae for freshness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/homebrew-extensions
          ref: ${{ steps.extensions-source.outputs.commit }}
          path: homebrew-extensions
          persist-credentials: false

      - name: Recheck published inputs after queueing
        id: freshness
        env:
          PHP_VERSION: ${{ inputs.php-version }}
          CHANNEL: ${{ inputs.channel }}
          FORCE: ${{ inputs.force }}
          PUBLISH: ${{ inputs.publish }}
          HOMEBREW_PHP_PATH: ${{ github.workspace }}/homebrew-php
          HOMEBREW_EXTENSIONS_PATH: ${{ github.workspace }}/homebrew-extensions
        run: bash scripts/build/check-build-freshness.sh

  architecture:
    name: ${{ matrix.arch }}
    needs: matrix
    if: ${{ needs.matrix.outputs.build-required == 'true' }}
    permissions:
      contents: write
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.build) }}
    uses: ./.github/workflows/build-architecture.yml
    with:
      php-version: ${{ matrix.php }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
      test-runners: ${{ toJSON(matrix.test_runners) }}
      variants: ${{ needs.matrix.outputs.variants }}
      builds: ${{ inputs.builds }}
      ts: ${{ inputs.ts }}
      homebrew-php-commit: ${{ needs.matrix.outputs.source-commit }}
      homebrew-extensions-commit: ${{ needs.matrix.outputs.extensions-source-commit }}
      source-cache-release: ${{ inputs.source-cache-release }}
      reuse-archives: ${{ inputs.reuse-archives }}
      force-source: ${{ inputs.force-source }}

  cache-bottles:
    name: Cache missing dependency bottles in Cloudflare
    if: ${{ always() && !cancelled() && needs.matrix.outputs.build-required == 'true' }}
    needs: [matrix, architecture]
    uses: ./.github/workflows/cache-bottles.yml
    permissions:
      contents: read
      actions: read
    secrets:
      CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
      CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
      CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}

  publish:
    name: Publish PHP ${{ inputs.php-version }} release assets
    if: ${{ inputs.publish && needs.matrix.outputs.build-required == 'true' }}
    needs: [matrix, architecture]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: php-darwin-release-publish-${{ inputs.php-version }}
      cancel-in-progress: false
    permissions:
      # Required to create and replace GitHub Release assets.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated caches
        uses: ./.github/actions/download-artifacts
        timeout-minutes: 10
        with:
          pattern: php-${{ inputs.php-version }}-*
          path: builds

      - name: Restore published ARM caches not rebuilt in this run
        if: ${{ !contains(inputs.architectures, 'arm64') }}
        env:
          ARCH: arm64
          HOMEBREW_EXTENSIONS_COMMIT: ${{ needs.matrix.outputs.extensions-source-commit }}
          HOMEBREW_PHP_COMMIT: ${{ needs.matrix.outputs.source-commit }}
          PHP_VERSION: ${{ inputs.php-version }}
        run: bash scripts/cache/restore-published-architecture.sh builds

      - name: Restore published Intel caches not rebuilt in this run
        if: ${{ !contains(inputs.architectures, 'x86_64') }}
        env:
          ARCH: x86_64
          HOMEBREW_EXTENSIONS_COMMIT: ${{ needs.matrix.outputs.extensions-source-commit }}
          HOMEBREW_PHP_COMMIT: ${{ needs.matrix.outputs.source-commit }}
          PHP_VERSION: ${{ inputs.php-version }}
        run: bash scripts/cache/restore-published-architecture.sh builds

      - name: Replace versioned release assets
        env:
          PHP_DARWIN_MIRROR_REQUIRED: 'true'
          CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_AWS_ACCESS_KEY_ID }}
          CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_AWS_SECRET_ACCESS_KEY }}
          CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_EXTENSIONS_COMMIT: ${{ needs.matrix.outputs.extensions-source-commit }}
          HOMEBREW_PHP_COMMIT: ${{ needs.matrix.outputs.source-commit }}
          PHP_VERSION: ${{ inputs.php-version }}
        run: bash scripts/release/publish.sh builds

  e2e:
    name: Test the published PHP ${{ inputs.php-version }} cache through setup-php
    if: ${{ inputs.publish && contains(inputs.builds, 'release') && contains(inputs.ts, 'nts') }}
    needs: publish
    uses: ./.github/workflows/e2e.yml
    with:
      php-version: ${{ inputs.php-version }}

  report:
    name: Report cache work and workflow timings
    if: ${{ always() }}
    needs: [matrix, architecture, cache-bottles, publish, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download available timing data
        if: ${{ needs.matrix.outputs.build-required == 'true' }}
        continue-on-error: true
        uses: ./.github/actions/download-artifacts
        with:
          pattern: timing-*
          path: .timing
      - name: Report build, packaging, testing, and queue time
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build/workflow-report.cjs workflow
      - name: Upload workflow performance report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workflow-performance
          path: workflow-performance.json
          compression-level: 0
          retention-days: 30
          overwrite: true
