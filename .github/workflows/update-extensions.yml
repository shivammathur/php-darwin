name: Update optional extension caches
run-name: ${{ inputs.php-versions && format('Check optional extension caches for PHP {0}', inputs.php-versions) || 'Check optional extension caches' }}

on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
    inputs:
      php-versions:
        description: Space-separated PHP versions (empty selects all configured versions)
        type: string
      after-run:
        description: Optional workflow run ID which must succeed before dispatching
        type: string

permissions:
  contents: read

concurrency:
  group: update-extension-caches-${{ inputs.after-run || 'scheduled' }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the approved dependency snapshot
        id: dependencies
        run: echo "core=$(node scripts/cache/approved-dependencies.cjs core)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/homebrew-extensions
          path: homebrew-extensions
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Homebrew/homebrew-core
          ref: ${{ steps.dependencies.outputs.core }}
          path: homebrew-core
          persist-credentials: false
      - name: Dispatch only changed PHP versions after the prerequisite succeeds
        env:
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
          PHP_VERSIONS: ${{ inputs.php-versions }}
          AFTER_RUN: ${{ inputs.after-run }}
        run: node scripts/release/extension-packs.cjs dispatch
