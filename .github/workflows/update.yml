name: Update stable PHP caches

on:
  schedule:
    - cron: '40 */4 * * *'
  repository_dispatch:
    types: [homebrew-php-release]
  workflow_dispatch:
    inputs:
      php-version:
        description: Optional stable PHP minor; empty checks every stable version
        required: false
        type: string

concurrency:
  group: dependency-consumer-checks
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    name: Compare stable formula sources
    permissions:
      # Required to dispatch cache-stable.yml when a release is stale.
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out homebrew-php once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/homebrew-php
          path: homebrew-php
          persist-credentials: false

      - name: Check out homebrew-extensions once
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivammathur/homebrew-extensions
          path: homebrew-extensions
          persist-credentials: false

      - name: Select approved dependency recipes
        id: core
        run: bash scripts/build/source-commit.sh core

      - name: Check out Homebrew core for dependency freshness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Homebrew/homebrew-core
          ref: ${{ steps.core.outputs.commit }}
          path: homebrew-core
          persist-credentials: false

      - name: Apply approved dependency recipe updates
        run: node scripts/cache/dependency-recipes.cjs apply homebrew-core

      - name: Prepare changed dependencies before PHP
        id: dependencies
        env:
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
        run: node scripts/cache/dependency-gate.cjs dispatch

      - name: Compare formula sources with published release manifests
        if: steps.dependencies.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ secrets.TOKEN || github.token }}
          HOMEBREW_EXTENSIONS_PATH: ${{ github.workspace }}/homebrew-extensions
          HOMEBREW_CORE_PATH: ${{ github.workspace }}/homebrew-core
          HOMEBREW_PHP_PATH: ${{ github.workspace }}/homebrew-php
          ONLY_VERSION: ${{ github.event.client_payload['php-version'] || inputs.php-version }}
        run: bash scripts/release/update.sh
