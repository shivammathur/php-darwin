name: Validate optional extension packs on self-hosted runners
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self-hosted:
    uses: shivammathur/test-setup-php/.github/workflows/extensions.yml@e886e895f2a045ffb6b1a926fc4a0a24b3a9162c
    with:
      cases: '[{"php":"5.6","runner":"macos-15-x86_64"},{"php":"8.7","runner":"macos-15-x86_64"}]'
    secrets:
      TOKEN: ${{ secrets.TOKEN }}
