name: Test optional extension caches through setup-php
on:
  workflow_dispatch:
    inputs:
      php-versions:
        type: string
        default: '["8.4"]'
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  self-hosted:
    uses: shivammathur/test-setup-php/.github/workflows/extensions.yml@6a532039f5d7ac5488715b8491a8f57f3467093b
    with:
      runners: '["macos-15-x86_64"]'
      php-versions: ${{ inputs.php-versions || format('["{0}"]', inputs.php-version) }}
