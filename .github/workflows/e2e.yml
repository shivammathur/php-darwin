name: Test optional extension caches through setup-php
on:
  workflow_dispatch:
    inputs:
      php-versions:
        type: string
        default: '["8.4"]'
  workflow_call:
    inputs:
      php-version:
        required: true
        type: string
permissions:
  contents: read
jobs:
  self-hosted:
    uses: shivammathur/test-setup-php/.github/workflows/extensions.yml@6dc81b2fdb24a37c50bb4b94d6dfcf8f13056683
    with:
      runners: '["macos-15-x86_64"]'
      php-versions: ${{ inputs.php-versions || format('["{0}"]', inputs.php-version) }}
