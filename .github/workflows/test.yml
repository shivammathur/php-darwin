name: Test PHP cache
run-name: Test PHP ${{ inputs.php-version }} cache from run ${{ inputs.run-id }} on ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      php-version:
        description: PHP minor version
        required: true
        type: string
      run-id:
        description: Workflow run containing architecture artifacts
        required: true
        type: string
      runner:
        description: macOS runner label
        options:
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
        required: true
        type: choice

permissions:
  actions: read
  contents: read

env:
  HOMEBREW_DEVELOPER: '1'

jobs:
  test:
    name: Test PHP ${{ inputs.php-version }} packages on ${{ inputs.runner }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      PHP_VERSION: ${{ inputs.php-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read dependency approval from the archive producer
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.run-id }}
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          revision=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq .head_sha)
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags --depth=1 origin "$revision"
          if git cat-file -e "$revision:conf/dependencies.json"; then
            git show "$revision:conf/dependencies.json" > conf/dependencies.json
          fi

      - name: Validate packaged PHP archives
        uses: ./.github/actions/test-cache
        with:
          php-version: ${{ inputs.php-version }}
          runner: ${{ inputs.runner }}
          run-id: ${{ inputs.run-id }}
          github-token: ${{ secrets.TOKEN || github.token }}
