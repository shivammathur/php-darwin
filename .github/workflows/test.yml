name: Test PHP cache
run-name: Test PHP ${{ inputs.php-version }} cache from run ${{ inputs.run-id }} on ${{ inputs.runner }}

on:
  workflow_dispatch:
    inputs:
      php-version:
        description: PHP minor version
        required: true
        type: string
      run-id:
        description: Workflow run containing architecture artifacts
        required: true
        type: string
      runner:
        description: macOS runner label
        options:
          - macos-14
          - macos-15
          - macos-15-intel
          - macos-26
          - macos-26-intel
          - macos-latest
        required: true
        type: choice
      trace-install:
        description: Trace installer commands to diagnose slow or failed installs
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

env:
  HOMEBREW_DEVELOPER: '1'

jobs:
  target:
    name: Resolve compatibility-test target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      arch: ${{ steps.target.outputs.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve runner architecture
        id: target
        env:
          RUNNER: ${{ inputs.runner }}
        run: bash scripts/tests/helpers/get-test-target.sh

  test:
    name: Test PHP ${{ inputs.php-version }} packages on ${{ inputs.runner }}
    needs: target
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 90
    env:
      ARCH: ${{ needs.target.outputs.arch }}
      PHP_VERSION: ${{ inputs.php-version }}
      PHP_DARWIN_TRACE_INSTALL: ${{ inputs.trace-install }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Remove unused Homebrew taps
        run: bash scripts/build/cleanup-taps.sh

      - name: Download architecture caches
        uses: ./.github/actions/download-artifacts
        timeout-minutes: 10
        with:
          github-token: ${{ secrets.TOKEN || github.token }}
          pattern: php-${{ inputs.php-version }}-${{ needs.target.outputs.arch }}*
          merge-multiple: true
          path: ${{ runner.temp }}/php-darwin
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run-id }}

      - name: Prepare release/NTS Homebrew formula source
        id: prepare-release-nts
        env: &release-nts
          BUILD: release
          TS: nts
        run: bash scripts/tests/native/install.test.sh prepare

      - name: Install release/NTS Homebrew cache
        env: *release-nts
        run: bash scripts/tests/native/install.test.sh install

      - name: Validate release/NTS PHP runtime and build flags
        env: *release-nts
        run: bash scripts/tests/native/install.test.sh runtime

      - name: Validate release/NTS Homebrew state and operations
        env: *release-nts
        run: bash scripts/tests/native/install.test.sh homebrew

      - name: Reset runner after release/NTS validation
        if: ${{ always() && steps.prepare-release-nts.outcome != 'skipped' && steps.prepare-release-nts.outcome != '' }}
        env: *release-nts
        run: bash scripts/tests/native/install.test.sh reset

      - name: Prepare release/ZTS Homebrew formula source
        id: prepare-release-zts
        env: &release-zts
          BUILD: release
          TS: zts
        run: bash scripts/tests/native/install.test.sh prepare

      - name: Install release/ZTS Homebrew cache
        env: *release-zts
        run: bash scripts/tests/native/install.test.sh install

      - name: Validate release/ZTS PHP runtime and build flags
        env: *release-zts
        run: bash scripts/tests/native/install.test.sh runtime

      - name: Validate release/ZTS Homebrew state and operations
        env: *release-zts
        run: bash scripts/tests/native/install.test.sh homebrew

      - name: Reset runner after release/ZTS validation
        if: ${{ always() && steps.prepare-release-zts.outcome != 'skipped' && steps.prepare-release-zts.outcome != '' }}
        env: *release-zts
        run: bash scripts/tests/native/install.test.sh reset

      - name: Prepare debug/NTS Homebrew formula source
        id: prepare-debug-nts
        env: &debug-nts
          BUILD: debug
          TS: nts
        run: bash scripts/tests/native/install.test.sh prepare

      - name: Install debug/NTS Homebrew cache
        env: *debug-nts
        run: bash scripts/tests/native/install.test.sh install

      - name: Validate debug/NTS PHP runtime and build flags
        env: *debug-nts
        run: bash scripts/tests/native/install.test.sh runtime

      - name: Validate debug/NTS Homebrew state and operations
        env: *debug-nts
        run: bash scripts/tests/native/install.test.sh homebrew

      - name: Reset runner after debug/NTS validation
        if: ${{ always() && steps.prepare-debug-nts.outcome != 'skipped' && steps.prepare-debug-nts.outcome != '' }}
        env: *debug-nts
        run: bash scripts/tests/native/install.test.sh reset

      - name: Prepare debug/ZTS Homebrew formula source
        id: prepare-debug-zts
        env: &debug-zts
          BUILD: debug
          TS: zts
        run: bash scripts/tests/native/install.test.sh prepare

      - name: Install debug/ZTS Homebrew cache
        env: *debug-zts
        run: bash scripts/tests/native/install.test.sh install

      - name: Validate debug/ZTS PHP runtime and build flags
        env: *debug-zts
        run: bash scripts/tests/native/install.test.sh runtime

      - name: Validate debug/ZTS Homebrew state and operations
        env: *debug-zts
        run: bash scripts/tests/native/install.test.sh homebrew

      - name: Reset runner after debug/ZTS validation
        if: ${{ always() && steps.prepare-debug-zts.outcome != 'skipped' && steps.prepare-debug-zts.outcome != '' }}
        env: *debug-zts
        run: bash scripts/tests/native/install.test.sh reset
