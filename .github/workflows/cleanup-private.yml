name: Preserve and remove private build runs

on:
  workflow_run:
    workflows: [Stage private PHP]
    types: [completed]
  workflow_dispatch:
    inputs:
      build-id:
        description: Completed private build ID (run-attempt)
        required: true
        type: string

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIVATE_BUILD_ID: ${{ inputs.build-id || format('{0}-{1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) }}
      CF_R2_AWS_ACCESS_KEY_ID: ${{ secrets.PRIVATE_R2_ACCESS_KEY_ID }}
      CF_R2_AWS_SECRET_ACCESS_KEY: ${{ secrets.PRIVATE_R2_SECRET_ACCESS_KEY }}
      CF_R2_AWS_S3_ENDPOINT: ${{ secrets.CF_R2_AWS_S3_ENDPOINT }}
      PRIVATE_RELEASE_SIGNING_KEY: ${{ secrets.PRIVATE_RELEASE_SIGNING_KEY }}
      GH_TOKEN: ${{ secrets.TOKEN || github.token }}
    steps:
      # Always run trusted workflow code, never check out workflow_run.head_sha.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preserve run evidence in R2 before deleting the completed run
        run: node scripts/private/run.cjs cleanup node scripts/private/release.cjs cleanup
