name: Validate R2 publication recovery
on:
  push:
    branches: [fix/r2-publication-validation-20260928]
permissions:
  contents: read
jobs:
  local:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - run: bash scripts/tests/run.sh
